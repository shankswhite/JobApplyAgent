name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Welcome to JobApplyAgent, @${{ github.actor }}! Thanks for your first PR.

            A few things to know:
            - Tests will run automatically — check the status below
            - Make sure you've linked a related issue (required for features)
            - Read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) if you haven't
            - For ATS-specific issues, please attach the output of `node scripts/probe-form.mjs <url>`

            We'll review your PR soon.
          issue-message: |
            Thanks for opening your first issue, @${{ github.actor }}! We'll take a look soon.

            In the meantime:
            - Check [SUPPORT.md](../blob/main/SUPPORT.md) for setup help
            - For ATS-specific bugs (Workday, Taleo, etc.), please include `node scripts/probe-form.mjs <url>` output
            - For eval / scoring / CV-render questions, the upstream [`santifer/career-ops`](https://github.com/santifer/career-ops) is a better venue
